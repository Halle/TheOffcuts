.dri-cohort-strip{
  /* DRI Your Career tokens — light. Dark values are swapped below. */
  --dri-text:#161320; --dri-text-dim:#4d4a5a; --dri-text-faint:#84808f;
  --dri-rule:#14121c1a; --dri-accent:#6e69c6; --dri-accent-deep:#4f48b8; --dri-on-accent:#ffffff;
  --dri-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --dri-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --dri-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; width:100%; margin:0;
  border-top:1px solid var(--dri-rule); border-bottom:1px solid var(--dri-rule);
  padding:20px 0;
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:22px;
  color:var(--dri-text);
}
.dri-cohort-strip *{ box-sizing:border-box; }
.dri-cs__left{ display:flex; flex-direction:column; gap:7px; min-width:0; flex:1 1 320px; }
.dri-cs__eyebrow{ font-family:var(--dri-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.16em; color:var(--dri-text-faint); }
.dri-cs__title{ font-family:var(--dri-serif); font-size:26px; line-height:1.15; color:var(--dri-text); text-wrap:pretty; margin:0; }
.dri-cs__meta{ font-family:var(--dri-mono); font-size:12px; color:var(--dri-text-dim); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.dri-cs__sep{ color:var(--dri-text-faint); }
.dri-cs__status{ color:var(--dri-accent); }
.dri-cs__right{ display:flex; align-items:center; gap:22px; }
.dri-cs__price{ display:flex; align-items:baseline; gap:9px; }
.dri-cs__price-struck{ font-family:var(--dri-mono); font-size:13px; color:var(--dri-text-faint); text-decoration:line-through; }
.dri-cs__price-main{ font-family:var(--dri-serif); font-size:26px; color:var(--dri-text); white-space:nowrap; }
.dri-cs__cta{
  display:inline-flex; align-items:center; gap:8px;
  min-height:42px; padding:0 20px;
  background:var(--dri-accent); color:var(--dri-on-accent);
  font-family:var(--dri-sans); font-weight:500; font-size:14px; line-height:1;
  border:0; border-radius:999px; text-decoration:none; white-space:nowrap; cursor:pointer;
  transition:background-color .15s ease;
}
.dri-cs__cta:hover{ background:var(--dri-accent-deep); color:var(--dri-on-accent); }
.dri-cs__arrow{ transition:transform .15s ease; }
.dri-cs__cta:hover .dri-cs__arrow{ transform:translateX(2px); }
.dri-cs__cta:focus-visible{ outline:2px solid var(--dri-accent); outline-offset:2px; }
@media (max-width:420px){
  .dri-cs__right{ flex-direction:column; align-items:stretch; gap:12px; width:100%; }

/* Dark via the host's OS preference, unless the host explicitly forces light. */
@media (prefers-color-scheme:dark){

<script>
(function () {
  if (window.__driSecurityStripInit) return; window.__driSecurityStripInit = true;

  var FEED = 'https://www.driyourcareer.com/api/public/next-cohorts';
  // Last known cohort. Used until the live fetch resolves, and whenever it's blocked/offline.
  // Keep in sync with the markup defaults when the cohort changes.
  var FALLBACK = { date: 'October 12', status: 'early-bird', price: '$699', early_bird: '$599' };

  function derive(c) {
    var status = c.status || 'enrolling';
    var price = c.price || '';
    var early = c.early_bird || '';
    var onDemand = status === 'on-demand';
    var earlyActive = status === 'early-bird' && !!early && early !== price;
    var statusLabel = {
      'enrolling': 'Enrolling now',
      'early-bird': early ? 'Early bird ' + early : 'Early bird',
      'waitlist': 'Waitlist open',
      'coming-soon': 'Dates coming soon',
      'on-demand': 'Available on demand'
    }[status] || 'Enrolling now';
    var ctaLabel = {
      'enrolling': 'Take the course',
      'early-bird': 'Take the course',
      'waitlist': 'Join the waitlist',
      'coming-soon': 'Get notified',
      'on-demand': 'Start the course'
    }[status] || 'Take the course';
    var dateLabel = onDemand ? 'Start any time'
      : (status === 'coming-soon' ? 'Next cohort TBA' : 'Starts ' + (c.date || ''));
    return {
      dateLabel: dateLabel, statusLabel: statusLabel, ctaLabel: ctaLabel,
      priceMain: earlyActive ? early : price, priceStruck: price, hasStruck: earlyActive
    };
  }

  function apply(el, c) {
    var v = derive(c);
    function set(k, t) { var n = el.querySelector('[data-dri="' + k + '"]'); if (n) n.textContent = t; }
    set('dateLabel', v.dateLabel);
    set('statusLabel', v.statusLabel);
    set('ctaLabel', v.ctaLabel);
    set('priceMain', v.priceMain);
    var struck = el.querySelector('[data-dri="priceStruck"]');
    if (struck) {
      if (v.hasStruck) { struck.textContent = v.priceStruck; struck.style.display = ''; }
      else { struck.style.display = 'none'; }
    }
  }

  function renderAll(c) {
    var els = document.querySelectorAll('[data-dri-security-strip]');
    for (var i = 0; i < els.length; i++) apply(els[i], c);
  }

  function start() {
    renderAll(FALLBACK); // authoritative fallback; matches markup, so no layout shift
    fetch(FEED)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) { var c = d && d.security; if (c) renderAll(c); })
      .catch(function () { /* keep fallback silently — this is a promo inside someone else's article */ });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
